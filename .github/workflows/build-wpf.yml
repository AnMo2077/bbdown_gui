name: Build WPF Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore BiliDownloaderWPF/BiliDownloaderWPF.csproj

    - name: Build
      run: dotnet build BiliDownloaderWPF/BiliDownloaderWPF.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish BiliDownloaderWPF/BiliDownloaderWPF.csproj --configuration Release --output publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BiliDownloaderWPF
        path: publish