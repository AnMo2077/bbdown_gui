name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller requests

    - name: Build with PyInstaller
      run: |
        pyinstaller --name BiliDownloader --add-data "lang;lang" --windowed --onefile gui.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BiliDownloader-exe
        path: dist/BiliDownloader.exe