name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布标签；留空则只上传 Artifact，不创建 Release"
        required: false
        default: "v2.2"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile sources
        run: python -m compileall -q app gui.py build_installer.py tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache third-party binaries
        uses: actions/cache@v4
        with:
          path: vendor
          key: binaries-${{ hashFiles('scripts/fetch-binaries.ps1') }}
          restore-keys: binaries-

      - name: Fetch BBDown / ffmpeg / aria2c / curl
        shell: pwsh
        run: ./scripts/fetch-binaries.ps1

      - name: Install build dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller pillow customtkinter

      - name: Build installer
        run: python build_installer.py

      - name: Verify installer
        shell: pwsh
        run: |
          Get-ChildItem dist
          $setup = "dist/BiliDownloader-Setup-2.2.exe"
          if (-not (Test-Path $setup)) { throw "安装包未生成: $setup" }
          $info = (Get-Item $setup).VersionInfo
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash
          $md5 = (Get-FileHash $setup -Algorithm MD5).Hash
          "Version: $($info.FileVersion) / $($info.ProductVersion)"
          "Publisher: $($info.CompanyName)"
          "SHA256: $sha"
          "MD5: $md5"
          Set-Content -Path dist/release-body.md -Encoding utf8 -Value @(
            "BiliDownloader 2.2 自动构建",
            "",
            "- 安装包：BiliDownloader-Setup-2.2.exe",
            "- SHA256：$sha",
            "- MD5：$md5",
            "",
            "本次构建由 GitHub Actions 自动生成并上传。"
          )

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BiliDownloader-Setup
          path: dist/BiliDownloader-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body_path: dist/release-body.md
          files: dist/BiliDownloader-Setup-*.exe
          overwrite_files: true
          draft: false
          prerelease: false
